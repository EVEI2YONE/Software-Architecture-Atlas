name: Catalog validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check canonical index and links
        run: python scripts/validate_catalog.py

      - name: Check agent search tests
        run: python -m unittest discover -s tests -v
